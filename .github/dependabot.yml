version: 2

updates:
  # yarn uses the npm ecosystem
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    # Security PRs only: no routine version bumps. Security PRs are not
    # subject to this limit.
    open-pull-requests-limit: 0
    labels:
      - dependencies
    # No target-branch: setting it (even to master) stops these options
    # from applying to security PRs, so they would no longer be grouped.
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 6
    labels:
      - dependencies
    groups:
      actions-all:
        update-types:
          - major
          - minor
          - patch
        patterns:
          - '*'
