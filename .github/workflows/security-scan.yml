name: Security Scans

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

concurrency:
  group: polinrider-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  polinrider-scan:
    name: PolinRider Supply-Chain Scan
    uses: respond-io/shared-github-actions/.github/workflows/polinrider-scan.yml@v1.2.0

  socket-firewall-scan:
    name: Socket Firewall Scan
    # Limit SFW to release branches without changing PolinRider coverage.
    if: >-
      github.event_name == 'pull_request' &&
      (github.base_ref == 'dev' || github.base_ref == 'master' || startsWith(github.base_ref, 'flight/'))
    uses: respond-io/shared-github-actions/.github/workflows/socket-firewall-scan.yml@7e144f1d81d4b81a69a8afbc54ad7df6f7eebb2f # v1.12.2
    secrets: inherit
